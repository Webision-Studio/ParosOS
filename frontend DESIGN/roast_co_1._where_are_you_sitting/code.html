<script>
  let selectedMode = 'table';
  let activeTableNum = 4;

  function selectTable(num, el) {
    selectedMode = 'table';
    activeTableNum = num;

    // Reset takeaway card
    const takeawayCard = document.getElementById('takeaway-card');
    if (takeawayCard) {
      takeawayCard.classList.remove('bg-primary-fixed', 'scale-[1.01]');
      takeawayCard.classList.add('bg-surface-container-lowest');
    }

    // Reset all table buttons
    document.querySelectorAll('.table-btn').forEach((btn) => {
      btn.className = "table-btn group relative flex flex-col items-center justify-center py-3 bg-surface-container-lowest rounded-xl shadow-[3px_3px_0px_#1C1917] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100";
      btn.style.border = "2px solid #1C1917";
      
      const numSpan = btn.querySelector('.font-headline-md');
      const tableTag = btn.querySelector('.font-label-sm');
      const capTag = btn.querySelectorAll('span')[2];
      if (numSpan) { numSpan.className = "font-headline-md text-headline-md font-extrabold text-on-surface leading-none mt-0.5"; }
      if (tableTag) { tableTag.className = "font-label-sm text-[10px] uppercase font-bold text-on-surface-variant"; }
      if (capTag) { capTag.className = "text-[10px] text-on-surface-variant mt-1 flex items-center gap-0.5"; }

      const badge = btn.querySelector('.absolute');
      if (badge) badge.remove();
    });

    // Style active table button
    el.className = "table-btn group relative flex flex-col items-center justify-center py-3 bg-primary-fixed rounded-xl shadow-[3px_3px_0px_#1C1917] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100 scale-[1.03]";
    el.style.border = "2.5px solid #1C1917";

    const activeNumSpan = el.querySelector('.font-headline-md');
    const activeTableTag = el.querySelector('.font-label-sm');
    const activeCapTag = el.querySelectorAll('span')[2];
    if (activeNumSpan) { activeNumSpan.className = "font-headline-md text-headline-md font-extrabold text-primary leading-none mt-0.5"; }
    if (activeTableTag) { activeTableTag.className = "font-label-sm text-[10px] uppercase font-bold text-primary"; }
    if (activeCapTag) { activeCapTag.className = "text-[10px] font-semibold text-primary mt-1 flex items-center gap-0.5"; }

    // Add playful sticker badge
    const badge = document.createElement('div');
    badge.className = "absolute -top-2.5 px-1.5 py-0.2 rounded bg-[#FEF08A] text-on-surface text-[9px] font-black uppercase tracking-tight shadow-[1px_1px_0px_#1C1917] whitespace-nowrap";
    badge.style.border = "1px solid #1C1917";
    badge.innerText = num === 4 ? "★ Best View" : "Selected";
    el.appendChild(badge);

    // Update CTA text
    document.getElementById('cta-label').innerText = `Continue to Table ${num} Menu`;
  }

  function selectTakeaway(el) {
    selectedMode = 'takeaway';
    
    // Clear tables
    document.querySelectorAll('.table-btn').forEach((btn) => {
      btn.className = "table-btn group relative flex flex-col items-center justify-center py-3 bg-surface-container-lowest rounded-xl shadow-[3px_3px_0px_#1C1917] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100";
      btn.style.border = "2px solid #1C1917";
      const numSpan = btn.querySelector('.font-headline-md');
      const tableTag = btn.querySelector('.font-label-sm');
      const capTag = btn.querySelectorAll('span')[2];
      if (numSpan) { numSpan.className = "font-headline-md text-headline-md font-extrabold text-on-surface leading-none mt-0.5"; }
      if (tableTag) { tableTag.className = "font-label-sm text-[10px] uppercase font-bold text-on-surface-variant"; }
      if (capTag) { capTag.className = "text-[10px] text-on-surface-variant mt-1 flex items-center gap-0.5"; }
      const badge = btn.querySelector('.absolute');
      if (badge) badge.remove();
    });

    // Highlight takeaway
    el.classList.remove('bg-surface-container-lowest');
    el.classList.add('bg-primary-fixed', 'scale-[1.01]');

    // Update CTA text
    document.getElementById('cta-label').innerText = "Continue to Takeaway Menu";
  }
